      title: ActiveQueryRunResponse
    AgreementSummary:
      properties:
        aligned:
          type: integer
          minimum: 0.0
          title: Aligned
        total:
          type: integer
          minimum: 0.0
          title: Total
        panel_agreement:
          type: string
          enum:
          - agreed
          - split
          - undetermined
          title: Panel Agreement
          default: undetermined
      type: object
      required:
      - aligned
      - total
      title: AgreementSummary
      description: 'Verdict-ring numerator/denominator for screen 05 (``aligned`` of

        ``total``).


        ``total`` is the number of initial answers on the run — INCLUDING

        failed/empty ones (matching :func:`summarize_agreement`, which uses

        ``len(initial_answers)``).


        ``aligned`` counts the models whose OPENING POSITION IS CARRIED INTO THE

        FINAL ANSWER. It is NOT a count of models that agree with each other, and

        the served captions no longer say that it is: for a minority opener the

        test is a 4-gram containment of its own opening against the model-written

        final synthesis (``synthesis_consensus._opening_reflected_in_final``). A

        run served "0 of 4 models aligned" above a consensus section reading "All

        agree seat-based is the more predictable revenue model" — both true of what

        they measured, only one captioned honestly. ADR-0062.


        A failed answer can never be counted. Neither can any model when there is

        no final answer at all: nothing was produced for a position to be carried

        into.'
    CitationCoverage:
      properties:
        answer_count:
          type: integer
          minimum: 0.0
          title: Answer Count
        sourced_answer_count:
          type: integer
          minimum: 0.0
          title: Sourced Answer Count
        sourced_answer_ratio:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Sourced Answer Ratio
        target_ratio:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Target Ratio
          default: '0.80'
        target_met:
          type: boolean
          title: Target Met
      type: object
      required:
      - answer_count
      - sourced_answer_count
      - sourced_answer_ratio
      - target_met
      title: CitationCoverage
      description: 'How much of the panel''s output carries a primary source.


        WP-C / F-03. The metric is **the fraction of answers that carry at least

        one primary (non-fallback) source** — nothing more, and the field names say

        so. It used to divide a per-answer BOOLEAN by a characters-based estimate

        of "material claims", so the numerator and denominator did not share units

        and a run of four long, fully-sourced answers scored ~12% against an 80%

        target. Every run was therefore labelled provisional and the recommendation

        always said "pause for human review".


        What this metric does NOT claim: that each individual assertion inside an

        answer is supported. Counting sources says a citation is present; it says

        nothing about whether the citation supports the claim. The signal that

        checks whether a citation marker resolves to a real source is

        ``citation_marker_grounding`` in :mod:`product_app.evaluation` — a

        different, host-keyed authority. Do not conflate the two.'
    CostBreakdown:
      properties:
        by_model:
          items:
            $ref: '#/components/schemas/CostLineByModel'
          type: array
          title: By Model
        by_stage:
          items:
            $ref: '#/components/schemas/CostLineByStage'
          type: array
          title: By Stage
        total:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total
      type: object
      required:
      - by_model
      - by_stage
      - total
      title: CostBreakdown
      description: 'Itemized cost partition for screen 03 (cost gate) and the 05 receipt.


        The estimate is partitioned two independent ways — ``by_model`` and

        ``by_stage`` — from the *same* underlying arithmetic that produces

        ``total``. Both lists re-sum to ``total`` exactly after quantization

        (the reconciliation invariant): every line is apportioned to

        :data:`COST_DISPLAY_QUANTUM` by :meth:`_reconcile_usd_lines` using a

        sign-safe largest-remainder rule, so every line is ``>= 0`` and the

        lines sum to ``total`` exactly.'
    CostConfirmation:
      properties:
        estimated_cost_usd:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Estimated Cost Usd
        confirmation_token:
          type: string
          title: Confirmation Token
      type: object
      required:
      - estimated_cost_usd
      - confirmation_token
      title: CostConfirmation
    CostEstimate:
      properties:
        estimated_cost_usd:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Estimated Cost Usd
        currency:
          type: string
          title: Currency
          default: USD
        threshold_action:
          $ref: '#/components/schemas/CostThresholdAction'
        confirmation_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirmation Token
        reasons:
          items:
            type: string
          type: array
          title: Reasons
        max_cost_usd:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Max Cost Usd
        breakdown:
          anyOf:
          - $ref: '#/components/schemas/CostBreakdown'
          - type: 'null'
        global_ceiling_reached:
          type: boolean
          title: Global Ceiling Reached
          default: false
        spend_metering_unavailable:
          type: boolean
          title: Spend Metering Unavailable
          default: false
      type: object
      required:
      - estimated_cost_usd
      - threshold_action
      - confirmation_token
      - reasons
      title: CostEstimate
    CostLineByModel:
      properties:
        model_id:
          type: string
          title: Model Id
        display_name:
          type: string
          title: Display Name
        usd:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Usd
        kind:
          type: string
          title: Kind
          default: model
      type: object
      required:
