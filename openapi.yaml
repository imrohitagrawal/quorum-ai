info:
  title: Quorum-AI
  description: Quorum-AI runs your question against four LLMs in parallel, has a separate moderator model critique their answers, and returns a single answer — written by a separate synthesis model — with explicit consensus, disagreement, source support, uncertainty, and recommendation. Cost is shown before the run starts; nothing executes without confirmation. Results are ephemeral. Open the workspace UI at /ui; health and readiness live at /health and /ready; the operator snapshot is at /status.
