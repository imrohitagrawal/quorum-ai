    TrustScore:
      properties:
        support_verified:
          type: boolean
          title: Support Verified
        band:
          type: string
          enum:
          - unverified
          - low
          - moderate
          - high
          title: Band
        score:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Score
        diagnostics:
          $ref: '#/components/schemas/TrustDiagnostics'
      type: object
      required:
      - support_verified
      - band
      - diagnostics
      title: TrustScore
      description: 'What a consumer may serve.


        The suppression is STRUCTURAL, not a convention: while

        ``support_verified`` is False, ``score`` IS ``None`` and ``band`` IS

        ``"unverified"``. There is no key on this model a client can read as a

        confidence number; the only number is the explicitly-named diagnostic

        composite and its per-component parts.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WarningType:
      type: string
      enum:
      - sensitive_data
      - high_stakes
      title: WarningType
