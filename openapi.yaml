      - signals
      - faithfulness_label
      - hallucination_risk
      - label_confidence
      - trust
      title: QueryRunEvaluationProjection
      description: 'The served S2 per-run evaluation (FR-015). Metrics only — never prose.


        Deliberately NOT ``RunEvaluation`` itself: that model carries the optional

        Layer-B ``judge`` verdict, whose ``rationale`` is free text written about

        provider prose. The served projection has no judge field at all, so there

        is no path — present or future — by which a rationale reaches a client.


        ``trust`` is the engine''s :class:`~product_app.evaluation.TrustScore`

        verbatim. While ``support_verified`` is False (which, with no real Layer-B

        judge, is every hermetic run) ``score`` IS ``None`` and ``band`` IS

        ``"unverified"``; the only number in the payload is the explicitly-named

        ``layer_a_composite_unverified`` diagnostic, which is not a confidence

        figure and is named so a client cannot mistake it for one. When the

        operator configures BOTH ``QUORUM_EVAL_JUDGE_API_KEY`` and

        ``QUORUM_EVAL_JUDGE_MODEL_ID`` (P1 wiring, ``_request_path_judge``) a

        conforming real-judge verdict whose CONTENT does not contradict the claim

        flips ``support_verified`` and the numeric ``score`` +

        ``low``/``moderate``/``high`` band serve verbatim — still metrics only; the

        judge rationale remains dropped. A conforming verdict that DOES contradict

        it — grounding or faithfulness at zero, or ``hallucination_risk: "high"``

        — serves the suppressed shape (#267,

        ``evaluation.verdict_supports_verification``). This sentence said

        "a conforming verdict flips ``support_verified``" full stop until

        2026-08-06, which #267 made false.'
