name: CI
on:
  # Manual lever: re-run the pipeline on-demand (e.g. after a flake or
  # an Actions hiccup) without inventing a commit. A workflow_dispatch run
  # on main still completes CI/Tests/E2E, which re-fires the workflow_run
  # deploy gate — so it can force a fresh deploy + live verification.
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    # Declared so the deploy-gate ceiling invariant (tests/unit/test_deploy_gate_
    # no_slow_push_jobs.py) covers this heaviest push job too — an uncapped job
    # defaults to 360 min and would be invisible to the ceiling math. Measured
    # ~3 min on a1cf546; 20 stays under the 1500s gate wait with wide headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the full pytest suite includes the day-one carry-forward
          # audit, which reads a pre-supersede blob via `git show <sha>:...`.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Validate enterprise factory gates
        run: make validate
      - name: Assert openapi.yaml is in sync with app.openapi()
        run: make openapi-check
      - name: Format check
        run: make format-check
      - name: Lint
        run: make lint
      - name: Type check
        run: make type-check
      - name: Unit tests
        run: make test-report
      - name: Security scan
        run: make security-scan
      - name: Build Docker image
        run: make docker-build
      - name: Upload release evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-hardening-evidence
          path: |
            build/test-results/pytest.xml
            build/coverage/coverage.xml
            build/security/security-scan.json
          if-no-files-found: error

  # R2 Phase-0 enforcement gates. All hermetic and $0: no API keys, live
  # execution is pinned off exactly as in the Tests workflow.
  #
  # "Hermetic" here is asserted by a test, not by this comment. Both blocking
  # gates that import product_app.main pin the model catalog to the shipped
  # static list, because that import fires openrouter_catalog_fetcher.prewarm()
  # and every model-slot lookup re-enters list_models(). Unpinned, a single
  # run of api-contract made 57 outbound TLS connect attempts to openrouter.ai
  # (MEASURED 2026-07-19). The proofs, which go red on a pin-removed mutant:
  #   perf-gate    -> tests/perf/test_perf_gate_hermeticity.py
  #   api-contract -> tests/contract/test_contract_gate_hermeticity.py
  # A new gate job that imports the app needs the same pin and its own probe.
  fr-completeness:
    name: FR traceability completeness (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Stdlib-only validator: no uv sync needed.
      - name: Every FR-0NN has a registry AND matrix row
        run: make fr-completeness

  perf-gate:
    # R2 reconciliation (2026-07-19): DOWNGRADED to ADVISORY. The regression
    # budgets (150/300/1500ms) were measured only on one macOS dev machine; a
    # slower CI runner can exceed them and false-fail the build, which violates
    # measure-on-the-target-environment (guardrail-values-need-measurement).
    # `continue-on-error: true` makes this job report but NOT block. TODO before
    # re-promoting to blocking: (1) measure p50/p95 on THIS ubuntu-latest runner,
    # (2) set the regression budget from that data, (3) isolate the latency-budget
    # spec (tests/perf/test_workflow_latency_percentiles.py) from the default
    # blocking suite (marker or dedicated path) so the main `pytest tests/` run
    # cannot false-fail on it either, then flip continue-on-error off + rename.
    name: Hermetic perf p50/p95 + concurrency (ADVISORY — CI budgets pending)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    env:
      OPENROUTER_LIVE_EXECUTION_ENABLED: "false"
      QUORUM_RUNTIME_ENVIRONMENT: "ci"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Perf gate
        run: make perf-gate

      # DEBT-009 — the measurement must OUTLIVE the run.
      #
      # `if: always()` on both steps is mandatory, not decoration. The job's
      # `continue-on-error` is JOB level: a budget failure still fails the
      # `make perf-gate` STEP, and every later step would be skipped by
      # default — losing precisely the over-budget sample that a budget
      # re-derivation most needs.
      - name: Publish the measured percentiles
        if: always()
        run: |
          if [ -f build/gates/perf-percentiles.json ]; then
            echo "## Perf percentiles (advisory sample)" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat build/gates/perf-percentiles.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat build/gates/perf-percentiles.json
          else
            # Issue #162/#166: this used to print the message below and exit 0
            # -- an honest log next to a lying (green) status. The JOB is
            # already advisory via `continue-on-error: true` above, so failing
            # THIS step cannot block a merge; it only stops the step's own
            # status from claiming a measurement that never happened.
            echo "no perf-percentiles.json produced — treat as UNMEASURED, not as clean" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload the percentiles artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-percentiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/gates/perf-percentiles.json
          if-no-files-found: error
          retention-days: 90

  api-contract:
    name: Schemathesis API contract (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_LIVE_EXECUTION_ENABLED: "false"
      QUORUM_RUNTIME_ENVIRONMENT: "ci"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Contract fuzzing against /openapi.json
        run: make api-contract

  diff-cover:
    name: Changed-lines coverage >= 95% (blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_LIVE_EXECUTION_ENABLED: "false"
      QUORUM_RUNTIME_ENVIRONMENT: "ci"
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover diffs against the merge-base with the PR base branch, so
          # the full history must be present. On a shallow clone the base ref is
          # absent and diff-cover exits 1 with "Could not find the branch to
          # compare to" (measured — it fails loud, it does not pass silently).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - name: Changed-lines coverage
        run: make diff-cover DIFF_BASE=origin/${{ github.base_ref }}
      - name: Upload diff-cover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-cover-report
          path: build/coverage/diff-cover.md
          if-no-files-found: ignore

  mutation-baseline:
    name: Mutation score on changed functions (advisory — measured, see study)
    # PULL-REQUEST ONLY — must NOT run on a push to main. The score is a per-PR,
    # CHANGED-FUNCTIONS-vs-base concept; on a push to main there is no meaningful
    # base and the scope explodes to the whole merged slice, running the full
    # `timeout-minutes` below (measured 2026-07-20: 30m, then cancelled by its own
    # timeout). Because this job lives in the deploy-gate-required "CI" workflow,
    # that 30m kept "CI" `in_progress` past the gate's 900s wait, so the gate
    # fail-safe refused to deploy and EVERY merge since 2026-07-17 (S1+Phase-0,
    # S2) silently never reached prod. Gating to pull_request keeps "CI" fast on
    # push so the gate can pass. The invariant is pinned by
    # tests/unit/test_deploy_gate_no_slow_push_jobs.py.
    if: github.event_name == 'pull_request'
    # ADVISORY — and this is now a MEASURED decision, not an unexamined default.
    # Full evidence: docs/metrics/mutation-gate-study.md.
    #
    # Issue #130 asked to make this blocking, arguing the job "finished in
    # 1m 9s on PR #96 and passed". The log shows it ABORTED at "failed to
    # collect stats" and was green only because a second advisory switch (a
    # leading `-` on the Makefile recipe) ignored the error. It had never
    # scored a single mutant in CI. The gate was then repaired and measured:
    #
    #   * real yield: 6 of 158 enumerated escaped defects (~4%), and 5 of the 6
    #     are uncovered branches the blocking diff-cover gate already catches;
    #   * 7% of pull requests would HARD ABORT — mutmut 3.6.0 skips decorated
    #     functions (except a bare @staticmethod/@classmethod); 34 of the 40
    #     under src/product_app are unmutatable;
    #   * 38% have unmutatable functions silently unmeasured;
    #   * 8% produce an empty scope (module-level constants, pure deletions)
    #     and pass having measured nothing.
    #
    # So roughly 15% of pull requests would get a wrong answer for 4% yield.
    # Independently, no published industrial practice blocks a merge on a
    # mutation score: Google surfaces mutants as review findings and states the
    # score "is neither concrete nor actionable"; StrykerJS defaults
    # `break: null`; PIT ships its threshold unset; mutmut has no score gate.
    # The 80% threshold here is ours, not the tool's.
    #
    # `continue-on-error` is therefore DELIBERATE. What is NOT restored is the
    # Makefile's leading `-`: the recipe still exits non-zero honestly, so a
    # local run and this job's own status tell the truth. Advisory here means
    # "reported, does not block a merge" — it does NOT mean "failures are
    # invisible". Pinned by tests/unit/test_mutation_gate_blocking.py.
    #
    # To revisit: fix the decorated-function abort, then re-measure yield
    # against a fresh defect census. Do not promote on runtime alone again.
    #
    # ----------------------------------------------------------------------
    # CHARTER — what this gate cannot see, and how it fails.
    # Required by docs/DAY-ONE-PROMPT.md 4a-bis, written next to the job because
    # that is where someone reading a tick will look.
    #
    # CANNOT SEE:
    #   * JavaScript, CSS, HTML templates or any browser behaviour. Measured:
    #     ~46% of this project's defects live outside src/ Python entirely.
    #   * module-level constants and config tables - about 35% of
    #     src/product_app sits outside every `def`, including the pricing table
    #     and the spend caps. Three of the five measured silent passes were
    #     money configuration.
    #   * decorated functions - 34 of 40 under src/product_app are unmutatable
    #     by mutmut 3.6.0; 7% of pull requests abort on this.
    #   * pure deletions - there is no surviving line to mutate.
    #   * a defect of OMISSION. Mutation testing perturbs code that EXISTS; it
    #     can say nothing about the case nobody handled, which is the shape of
    #     most of this repo's escaped defects.
    #
    # ITS OWN FAILURE MODES - the line #158 earned:
    #   * It can exit NON-ZERO without having measured anything. In the log that
    #     looks like `failed to collect stats. runner returned 1`, and it means
    #     the suite could not run inside ./mutants/ - a statement about the gate,
    #     not about the diff.
    #   * It can exit ZERO without having measured anything, when the changed
    #     functions produce an empty scope. The recipe now says so in words.
    #   * So NEITHER tick is evidence. Open the log and find the score. Measured
    #     2026-07-29: 11 of the last 11 pull-request runs produced no score at
    #     all - ten green, one red.
    # ----------------------------------------------------------------------
    continue-on-error: true
    #
    # Scope is CHANGED FUNCTIONS vs the base branch, not whole modules — see
    # docs/metrics/mutation-baseline.md for the measured baseline, the derived
    # threshold, and the measured runtime that justifies the timeout below.
    runs-on: ubuntu-latest
    # Measured locally: ~7-8m for the 21 changed functions (504 mutants, after
    # the RB-3 leak fix widened the scope from 425) on this branch with
    # --max-children 8. 30 min leaves headroom for a slower, 2-core runner.
    #
    # Issue #182: PR #181's diff touched one large function (146+ mutants)
    # and this JOB-level timeout fired mid-run, killing the whole job before
    # `make mutation-baseline`'s own report() step ever ran -- no score was
    # printed at all. `make mutation-baseline` now bounds `mutmut run` itself
    # to MUTATION_RUN_DEADLINE_SECONDS (scripts/run_with_deadline.py, default
    # 24 minutes) well inside this 30-minute ceiling, so report() always
    # runs and always scores whatever mutants/**/*.py.meta state exists --
    # partial or complete -- instead of this external timeout silently
    # eating the whole job.
    timeout-minutes: 30
    env:
      OPENROUTER_LIVE_EXECUTION_ENABLED: "false"
      QUORUM_RUNTIME_ENVIRONMENT: "ci"
      # Never let a repo-level DSN reach a mutation run: mutmut copies the
      # project into ./mutants/ and re-runs the suite hundreds of times.
      SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The scope step diffs against the base branch, so that ref has to exist
      # locally; on a push build there is no base_ref and we fall back to main.
      - name: Fetch base ref
        run: git fetch --no-tags origin "${{ github.base_ref || 'main' }}"
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Mutation score on changed functions
        run: make mutation-baseline DIFF_BASE=origin/${{ github.base_ref || 'main' }}
      # HONEST STATUS: this step reports SKIPPED on this runner, always.
      #
      # The doc-honesty guard SKIPS without build/mutation/score.txt, which is
      # the normal state in the `quality` job and in a fresh clone. This job is
      # the only place in CI where the artifact exists, so it used to be the
      # only place the artifact tier could run. It must INFORM, not block: the
      # killed/timeout split
      # is hardware- and load-dependent (baseline §5), so a Linux runner
      # legitimately differs from the recorded macOS numbers.
      #
      # It used to get that leniency for free from the job's
      # `continue-on-error: true`. That flag is still on the JOB, but the
      # leniency is NOT restated as a step-level `continue-on-error` — that would make
      # this job read as advisory to tests/test_doc_gate_consistency.py, which
      # deliberately treats any downgraded `run:` step as a downgraded gate.
      # Loosening that detector to "all run steps" would let a genuinely
      # downgraded gate step hide behind one blocking step, so the detector
      # stays as it is.
      #
      # Instead the artifact tier skips itself off the machine profile the doc
      # actually records (macOS, §2). So on this Linux runner it reports
      # SKIPPED — the artifact comparison is a LOCAL, macOS-only check and is
      # deliberately not enforced anywhere in CI. Say it plainly rather than
      # leave a step that reads as coverage it does not provide.
      #
      # The step is kept because the SKIP line is the visible evidence of that
      # decision in the job log, and because the machine-INdependent tier of
      # the same file (threshold vs Makefile, per-run arithmetic) does run here
      # and does block — as it also does in the `quality` job's full pytest
      # run. Nothing enforceable is lost; nothing unenforceable is claimed.
      - name: Mutation doc honesty (artifact tier)
        if: always()
        run: uv run pytest tests/test_mutation_baseline_doc.py -v --no-cov -p no:randomly
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: build/mutation/
          if-no-files-found: ignore

