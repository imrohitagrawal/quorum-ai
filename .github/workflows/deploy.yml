name: Deploy to Fly.io

# Deploys the app to Fly.io. Gated on ALL required CI workflows: this runs only
# AFTER every required workflow — "CI" (ci.yml), "Tests" (test.yml), and
# "E2E (axe + parity)" (e2e.yml) — has concluded SUCCESSFULLY for the SAME commit
# on main. A red build in ANY of the three never reaches production (issues #21,
# #37). ``workflow_dispatch`` remains as a manual escape hatch (deploys whatever
# is on the default branch, ungated — operator's explicit choice).
#
# Mechanism: each of the three workflows completing on main fires this via
# ``workflow_run``. The `gate` job (``scripts/deploy_gate.py``) then WAITS —
# bounded poll of the Actions API for the head SHA — until every required
# workflow reaches a terminal conclusion, and lets `deploy` run only when ALL
# three are green. Waiting (rather than the old skip-and-hope) removes the race
# where a trigger from a fast check ran the gate before the slow E2E finished,
# skipped, and no later trigger deployed — leaving a merge silently undeployed
# (PR #44). A per-SHA concurrency group collapses duplicate triggers to one.
#
# When the gate blocks (a required workflow failed, or timed out unresolved),
# `deploy_gate.py` exits non-zero IFF that SHA is still main's tip — a real
# stranding, since nothing else will ever deploy it — so this `gate` job (and
# therefore the whole run) reports failure, not a green run with a silently
# skipped `deploy` job (issue #62). A SHA that has since been superseded by a
# newer main commit stays a quiet (exit 0) skip: the newer commit's own Deploy
# run is the one that verifies deployment.
#
# That paragraph described a contract this file did not have until #245: the
# `gate` job's own `if:` required the trigger's conclusion to be `success`, so
# on a red main the job SKIPPED and the stranding check never ran. Zero of the
# previous 200 Deploy runs had ever reported failure. See ADR-0024 and the
# note above the `if:` below — the conclusion term is absent deliberately.
on:
  workflow_run:
    workflows: ["CI", "Tests", "E2E (axe + parity)"]
    types: [completed]
  workflow_dispatch:

# Collapse duplicate triggers for the same commit (three workflows finishing
# close together) into one deploy; a newer trigger for the same SHA supersedes.
concurrency:
  group: deploy-fly-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Gate — require CI + Tests + E2E green for the SHA
    runs-on: ubuntu-latest
    # Only consider deploying on a manual dispatch, or for a GENUINE push to our
    # repo's main. The ``event == 'push'`` +
    # ``head_repository.full_name == github.repository`` conditions are
    # security-critical: ``head_branch == 'main'`` alone is spoofable by a fork
    # PR whose source branch is literally named ``main`` (that run would carry
    # attacker code + an attacker commit). Requiring a push from our own repo
    # defeats that (a fork PR run is ``pull_request`` on the fork).
    # ``scripts/deploy_gate.py`` re-applies the same filter per run.
    #
    # NOTE the absence of a ``workflow_run.conclusion == 'success'`` term, and
    # do NOT restore it (issues #62, #245). It made this job SKIP whenever a
    # required workflow was red — that is, precisely when a merge can be
    # stranded — so the stranding detection at ``deploy_gate.py:310-321`` sat
    # downstream of the very condition it exists to detect, and had never once
    # run. Measured 2026-08-07 over the previous 200 Deploy runs:
    # 130 skipped, 35 cancelled, 35 success, ZERO failures.
    #
    # Admitting a non-success trigger cannot cause a deploy: the gate proceeds
    # on an allow-LIST (every required workflow must read ``success`` —
    # ``deploy_gate.py``'s ``_SUCCESS`` check), and the ``deploy`` job
    # additionally requires ``needs.gate.outputs.proceed == 'true'``. It only
    # lets the gate CLASSIFY the outcome: still main's tip → stranded → exit 1
    # → this run reports failure; superseded by a newer commit → quiet exit 0.
    # Pinned by tests/unit/test_stranded_deploy_fails_loud.py.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      # Records WHICH workflow fired this run. The Actions API does not expose a
      # Deploy run's triggering workflow, so #245's claim 1 — "E2E (axe +
      # parity) never triggers Deploy" — could only be INFERRED from timestamps,
      # and that inference disagreed with itself: on 79ad02a no Deploy run
      # followed E2E's conclusion, while on 21cb499d two were created after it.
      # Neither observation names a trigger. This makes the question answerable
      # from any future run's log instead of re-derived from correlation.
      # DIAGNOSTIC ONLY — nothing branches on these values.
      #
      # The context values go through `env:` rather than into the `run:` body:
      # a workflow NAME is arbitrary text, and interpolating it directly into a
      # shell script is the standard Actions script-injection sink.
      - name: Record which workflow triggered this run
        env:
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          echo "triggering_workflow=${TRIGGER_NAME:-(manual dispatch)}"
          echo "triggering_conclusion=${TRIGGER_CONCLUSION:-(none)}"
          echo "triggering_event=${TRIGGER_EVENT:-(none)}"
          echo "head_sha=${TRIGGER_SHA:-$DISPATCH_SHA}"
      - uses: actions/checkout@v4
        with:
          # Same pin as the deploy job's checkout: for a dispatch, github.sha
          # (event-time commit) rather than the branch ref, so the gate and
          # the deploy always run from the same tree.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for all required workflows to be green for this SHA
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # The gate WAITS (bounded) for pending required workflows rather than
          # skipping. It must exceed the LONGEST a required push job may legitimately
          # run — its declared `timeout-minutes` ceiling — or the gate fail-safes and
          # strands the deploy before a slow-but-valid job finishes. The blocking
          # push jobs in the required workflows (perf-gate [advisory], api-contract,
          # validate-and-test, e2e) cap at `timeout-minutes: 20` (1200s), so 1500s
          # clears the longest ceiling with headroom. (The 30-min mutation job is
          # now pull_request-only and never runs here.) Was 900s, which timed out
          # under the mutation job and stranded every merge 2026-07-17..21. Invariant
          # pinned by tests/unit/test_deploy_gate_no_slow_push_jobs.py.
          GATE_TIMEOUT_SECONDS: "1500"
          GATE_POLL_SECONDS: "15"
        run: python scripts/deploy_gate.py

  deploy:
    name: Deploy to Fly.io
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # For a workflow_run trigger, check out the EXACT commit that passed
          # CI (main's HEAD may have advanced since). For a manual dispatch,
          # pin to github.sha — the commit the dispatch event was created at —
          # rather than the branch ref: a branch ref resolves to the tip AT
          # FETCH TIME, so a push landing mid-run would make the built tree
          # diverge from the GIT_SHA stamped into /status.build_sha below.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Guard — only deploy if this SHA is still main's tip
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # The per-SHA concurrency group only serialises deploys of the SAME
          # commit. Because the gate now WAITS (up to ~min) for slow checks, an
          # older commit's deploy can finish AFTER a newer commit already
          # shipped — deploying the older one would regress production. Deploy
          # only when this SHA is still main's tip; otherwise the newer commit's
          # own deploy handles it. (Manual dispatch has no workflow_run SHA →
          # deploy the dispatch-time commit, github.sha, which checkout pinned.)
          if [ -z "${SHA}" ]; then
            echo "Manual dispatch — deploying the dispatch-time commit (github.sha)."
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TIP=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          if [ "${TIP}" = "${SHA}" ]; then
            echo "SHA ${SHA} is still main's tip — deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "SHA ${SHA} superseded by main tip ${TIP} — skipping (the newer commit's deploy handles it)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Fly.io CLI
        if: steps.fresh.outputs.deploy == 'true'
        # Pinned to a commit SHA (was ``@master``) for a reproducible,
        # supply-chain-safe toolchain — this is the exact revision that ran
        # green on the 2026-07-15 deploy.
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy to Fly.io
        if: steps.fresh.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # GIT_SHA: the exact commit being deployed (workflow_run's head SHA;
        # for a manual dispatch, the dispatching ref's SHA). The Dockerfile
        # bakes it into BUILD_SHA and /status serves it as ``build_sha`` —
        # deploy verification is then one line:
        #   curl -s https://quorum.stackclimb.com/status | jq -r .build_sha
        run: >-
          flyctl deploy --remote-only --strategy immediate
          --build-arg GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Smoke test - GET /health
        if: steps.fresh.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Wait for the new deploy to become healthy.
          # Fly's edge usually routes to the new instance within 10s.
          for i in {1..12}; do
            if curl -sf -o /dev/null -w "%{http_code}\n" https://quorum-ai.fly.dev/health | grep -q 200; then
              echo "Health check passed after ${i} attempts"
              exit 0
            fi
            echo "Health check failed (attempt ${i}), retrying in 5s..."
            sleep 5
          done
          echo "ERROR: Health check did not pass within 60s"
          exit 1

      - name: Smoke test - GET /ready
        if: steps.fresh.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # /ready returns 200 always; the body shows live_readiness state.
          # We assert state == "live" or "live" with drift (catalog mismatch)
          # but NOT "offline_by_*" - that means the deploy is misconfigured.
          RESPONSE=$(curl -sf https://quorum-ai.fly.dev/ready)
          echo "Ready response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"offline_by_'; then
            echo "ERROR: App booted in offline mode - check OPENROUTER_API_KEY"
            exit 1
          fi
          echo "Ready check passed"
