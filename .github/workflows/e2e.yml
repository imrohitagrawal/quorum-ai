name: E2E (axe + parity)

# Browser-level gate for the built workspace UI. Runs the committed
# end-to-end suites on every pull request and every push to main:
#
#   * tests/accessibility/axe-all-views.spec.ts — a real axe-core drive over
#     every SPA view in both themes; fails on any critical/serious WCAG
#     violation.
#   * tests/ui-parity/parity-behavior.spec.ts — behavioural contracts for the
#     design-comp parity work, including the markdown-link XSS regression.
#   * tests/docs/docs-under-csp.spec.ts — loads the self-hosted Swagger /docs
#     under the enforced CSP and fails on any CSP-violation console error
#     (proves the docs FUNCTION under the strict CSP, not just reference the
#     right asset URLs).
#   * tests/invariants/real-integration-smoke.spec.ts — drives the REAL sim
#     backend end-to-end with NO page.route mock (the counter to the mocked
#     "e2e" above). Blocking.
#   * tests/invariants/rendering-invariants.spec.ts — global rendering gate
#     (no raw Markdown / no overflow / monotonic timer) against the golden
#     messy fixture. BLOCKING. It was non-blocking only while it was
#     deliberately RED against the known #29/#30/#33 bugs; those fixes landed,
#     `continue-on-error` was removed, and the flip to hard enforcement is done
#     (see docs/analysis/03-enforcement-machinery.md). A red here is a real
#     regression and blocks the merge.
#   * tests/invariants/visual-snapshots.spec.ts — human-reviewed toHaveScreenshot
#     baselines for the result + transcript views, seeded as *-linux.png in this
#     CI container and compared like-for-like. BLOCKING.
#
# The mocked suites are hermetic: the FastAPI app is self-started by
# Playwright's webServer (local_simulation, no live OpenRouter calls) and every
# query POST is mocked per-test, so the job needs no secrets and no network
# egress. The real-integration smoke uses the same self-started sim backend but
# no per-test mock.
#
# RETRIES ARE ZERO — twice over, on purpose (RB-4):
#   * e2e/playwright.config.ts defaults `retries` to 0 for every lane, CI
#     included. Masking is explicit opt-in via `PW_RETRIES`, for local triage
#     only; it is never ambient and never on here.
#   * every invocation below ALSO passes `--retries=0`, so the gate declares
#     its own terms rather than inheriting whatever the config happens to say.
# The suites are deterministic by construction (per-test isolation, no shared
# run-state dependence), so a failure is a real failure. When one turns out to
# be intermittent anyway, the answer is flake-scan.yml (`--repeat-each=10`,
# measures the true rate) followed by QUARANTINE — never a retry, never a
# widened timeout. Pinned by tests/unit/test_e2e_flake_policy.py.

on:
  # Manual lever: re-run the pipeline on-demand (e.g. after a flake or
  # an Actions hiccup) without inventing a commit. A workflow_dispatch run
  # on main still completes CI/Tests/E2E, which re-fires the workflow_run
  # deploy gate — so it can force a fresh deploy + live verification.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e axe + parity (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The app boots without a live OpenRouter key: every query falls back to
      # local_simulation, which is exactly what the mocked suites expect. No
      # network egress is required.
      OPENROUTER_LIVE_EXECUTION_ENABLED: "false"
      # Stage B: the real env var is RUNTIME_ENVIRONMENT (Settings has no
      # env_prefix, so QUORUM_RUNTIME_ENVIRONMENT bound to nothing and "ci" is
      # not a valid enum member). "local" is REQUIRED here: the session
      # rate-limit override below is LOCAL-only and refused at startup outside
      # LOCAL, so this lane must run as LOCAL for the override to take effect.
      RUNTIME_ENVIRONMENT: "local"
      # Raise the per-IP /v1/session bucket so a --repeat-each e2e run measures
      # the product, not the 30/min limiter (parity ≈ 53 boots/run × 10 repeats).
      SESSION_RATE_LIMIT_PER_MINUTE: "600"
      # Issue #100: the DURABLE per-IP daily mint cap (2/24h in production)
      # is a separate control and needs its own override for the same
      # reason — without it, the 3rd cookie-less /ui boot in this run gets
      # a 429 and every invariant spec after it fails to render.
      SESSION_MINT_CAP_OVERRIDE: "600"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: the negative-assertion guard (#131) diffs the changed
          # spec files against the PR base, exactly as diff-cover and the
          # mutation gate do. On a shallow clone the base ref is absent, the
          # diff is empty, and the guard would silently check NOTHING.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --all-extras --dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      # #131 — the mutation gate reads Python only, so nothing checked that the
      # BROWSER tests can fail. A defect census found "tests that cannot fail"
      # to be the second-largest category of escaped defects here, ~28 of 32 in
      # TypeScript. This runs before Playwright: it is fast, and a spec that
      # cannot fail should be reported before spending 8 minutes running it.
      #
      # Scoped to CHANGED spec files, like diff-cover and the mutation gate.
      # This comment used to claim 21 pre-existing violations across 7 files.
      # That is no longer true: the tracked corpus sweeps clean. Because this
      # step only ever sees CHANGED specs, the standing check on the whole
      # corpus is
      # tests/unit/test_negative_assertion_guard.py::test_no_tracked_spec_is_reported_by_the_classifier,
      # which runs in the required `pytest (Python 3.12)` lane. Both are
      # tracked-only — `git ls-files` cannot see gitignored scratch specs.
      # Registered (and this step pinned) by the same test module.
      - name: Fetch base branch for the changed-spec diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Negative assertions have a positive partner (#131)
        if: github.event_name == 'pull_request'
        working-directory: e2e
        run: node tools/check-negative-assertions.mjs --base "origin/${{ github.base_ref }}"

      - name: Bound apt's network waits (a stalled mirror hung 3 attempts, 2026-08-19)
        uses: ./.github/actions/bound-apt-waits

      - name: Install Playwright Chromium (+ system deps)
        # chromium only; worst of 5 measured installs 132s -> 6 min is ~2.7x.
        # A hang now fails THIS step by name instead of silently
        # eating the job budget and reporting an unexplained 'cancelled'.
        timeout-minutes: 6
        id: install-chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Clear the previous lane's JUnit report
        run: rm -f e2e/results.xml

      - name: Run UI rendering + trust-score invariants (BLOCKING)
        working-directory: e2e
        # DETERMINISTIC gates run FIRST (fail-fast) — before the slower axe/parity
        # suites — so a real regression here surfaces immediately and is never
        # masked or delayed by an unrelated flake in a later step. These assert no
        # raw Markdown / no overflow / a monotonic timer (rendering-invariants) and
        # the FR-016 trust-surface contract (trust-score-invariants). HARD gate:
        # continue-on-error was removed (the enforcement handoff); a red here is a
        # real regression and blocks the merge.
        #
        # WP-B/F-15: verdict-band + theme-toggle were written as blocking gates
        # but never registered here — they were only swept by the visual-baseline
        # SEEDING workflow, which does not gate a merge. An unregistered gate is
        # not a gate. verdict-band pins the #8/#15 agreement-led band (incl. the
        # AA contrast of every band surface on the green consensus state and the
        # "never fabricate a coverage %" rule); theme-toggle pins #6 view by view.
        #
        # session-trail (PR8, issue #12) was the SAME omission one more time: the
        # spec landed in tests/invariants/ and passes, but was never named here,
        # so the conversation trail had no merge gate. The guard test
        # tests/test_e2e_workflow_covers_all_invariant_specs.py has been red on
        # exactly this since PR8 — that guard is doing its job, and this is the
        # fix it was asking for.
        env:
          CI: "true"
        run: >-
          npx playwright test
          tests/invariants/rendering-invariants.spec.ts
          tests/invariants/trust-score-invariants.spec.ts
          tests/invariants/verdict-band.spec.ts
          tests/invariants/theme-toggle.spec.ts
          tests/invariants/session-trail.spec.ts
          tests/invariants/readiness-banner.spec.ts
          tests/invariants/source-expander.spec.ts
          tests/invariants/answer-completeness.spec.ts
          tests/invariants/export-and-expanders.spec.ts
          tests/invariants/provider-notice-coverage.spec.ts
          tests/invariants/readiness-no-flash.spec.ts
          tests/invariants/source-support-denominator.spec.ts
          tests/invariants/markdown-corpus.spec.ts
          tests/invariants/landing-cta-reachable.spec.ts
          tests/invariants/result-debate.spec.ts
          tests/invariants/critique-cost-rows.spec.ts
          tests/invariants/peer-critique-copy.spec.ts
          --project=chromium
          --retries=0

      # EXECUTED-COUNT FLOOR. Playwright exits 0 when a spec path matches nothing
      # and when every test it found was skipped, so a lane that quietly stopped
      # running is indistinguishable from a clean pass — on a BLOCKING gate.
      # Floor is the EXACT count measured on 2026-08-04 (187), not a rounded-down
      # one. Re-measured for issue #124, which added
      # provider-notice-coverage.spec.ts (7 tests): the prior floor recorded here
      # (139, dated 2026-07-30) undercounted the CURRENT tree by 13 tests even
      # before this addition — other specs in the list above grew their own test
      # counts in the meantime, and nobody re-measured this comment. That gap is
      # itself the failure mode this floor exists to catch, just not yet wide
      # enough to trip a 139 floor; measuring fresh rather than adding 7 to a
      # stale number is why the floor reads a re-measured value rather than an
      # incremented one. Issue #117 added readiness-no-flash.spec.ts (3 tests at
      # the time; `grep -c "  test(" ` counts 8 there today, so do not read that
      # 3 as current — it is the delta that was measured, not the file's size)
      # and the lane was re-measured end to end after EACH review round rather
      # than incremented: 162, then 164, then 167. Never assumed.
      # Issue #193 added source-support-denominator.spec.ts (20 tests) and the
      # lane was re-measured end to end on 2026-08-04: "187 passed (3.7m)",
      # locally with the CI invocation above plus the two rate-limit overrides
      # local runs require. The earlier note here warned that a held #193 branch
      # would edit this line to 164 and that whichever landed second must
      # re-measure rather than take the larger number. That branch was abandoned
      # in favour of one cut from 52f72da: it predates the #240 batch, so it
      # conflicts in 7 files. It does NOT revert #117 — a three-way merge keeps
      # main's side, verified with `git merge-tree --write-tree` (the merged
      # tree carries `readinessConfirmed` 4 times, as main does). An earlier
      # draft of this comment claimed the revert; `git diff main..branch` shows
      # those lines as deletions only because the branch predates them, which is
      # not what a merge does. Headroom hides a
      # deleted spec: at a floor of 130, dropping session-trail.spec.ts (7 tests)
      # from the list above left this green — and session-trail is the spec this
      # workflow already records as having shipped ungated once. Adding tests
      # still passes; removing one is now a deliberate edit to this number: they
      # are not derived from the spec list above, or they could never detect
      # that list shrinking.
      - name: "invariants lane: floor on tests actually executed"
        # 187 -> 196 with the nine #120 specs (4 block-structure, 3 rendered-
        # marker, 2 caller-coverage). Raised in the same PR that adds them,
        # because leaving it at 187 would bank exactly the headroom the comment
        # above warns about: nine tests could then be deleted and this stays
        # green. Measured 2026-08-04, lane run exactly as this step runs it:
        # 196 passed.
        #
        # 196 -> 233 with markdown-corpus.spec.ts (37 tests: the whole #257
        # failure corpus driven through a real browser, the `html: false` XSS
        # pins, the obfuscated-link-scheme resolution check, and four tests for
        # the content loss two adversarial review lenses found). Same reasoning,
        # same PR — and MEASURED rather than added up, THREE times as the spec
        # grew: the lane gave 228, then 229, then 233, and the spec alone
        # reports 32, 33, 37. Every arithmetic guess in between was wrong, which
        # is the argument for re-running the lane rather than adding.
        #
        # Two notes for whoever measures next, both cost time here:
        #   * `--reporter=line` on the command line REPLACES the config's
        #     reporter list, so NO results.xml is written and this step then
        #     fails with "the lane never produced its JUnit report" — which
        #     looks like a lane that did not run. Drop the flag to re-measure.
        #   * one of the 32 is a `test.fail()` (a documented known gap,
        #     ADR-0015). Measured, JUnit records it as a normal pass — 32 tests,
        #     0 failures, 0 skipped — so it counts toward this floor and does
        #     not trip the no-skips policy above.
        #
        # 233 -> 244 with the three tally-caption tests in verdict-band.spec.ts.
        # MEASURED, not added: the lane run exactly as this step runs it reported
        # "244 passed (5.8m)" on 2026-08-21. Three of those 244 are new here
        # (`git diff origin/main -- e2e/tests/invariants/verdict-band.spec.ts |
        # grep -cE '^\+  test\('` -> 3), so the lane was already at 241 against a
        # floor of 233 — eight tests of headroom banked by PRs that added tests
        # without re-measuring, which is exactly the headroom the comment above
        # warns about. Moving to the measured number rather than to 236 closes it.
        #
        # 244 -> 253 -> 257 with result-debate.spec.ts. MEASURED at each step,
        # never added: the lane reported "253 passed (4.7m)" when the spec held
        # 9 tests, and "257 passed (4.7m)" after adversarial review added four
        # more (the caption-meaning pin, the two debate_mode provenance cases,
        # and the constant-focus-line check). Re-running the lane rather than
        # adding 4 is the same discipline the notes above record every previous
        # arithmetic guess failing.
        #
        # 257 -> 259 with critique-cost-rows.spec.ts (#290 / ADR-0093 decision
        # 3, two tests). MEASURED, not added: the lane run exactly as this step
        # runs it -- plus the two rate-limit overrides a LOCAL run needs
        # (AGENTS.md rule 13) -- reported "259 passed (4.6m)" on 2026-09-03.
        # The arithmetic happens to agree this time; it was still measured,
        # because every note above records an arithmetic guess that did not.
        #
        # 259 -> 263 with peer-critique-copy.spec.ts (ADR-0096, four tests).
        # MEASURED, not added: the lane run exactly as this step runs it, plus
        # the two rate-limit overrides a LOCAL run needs (AGENTS.md rule 13),
        # reported "263 passed (6.1m)" on 2026-09-03 — on a CLEANED `.data`,
        # because the durable per-IP mint cap accumulates across local runs and
        # a poisoned database presents as ~30 unrelated timeouts.
        run: python3 scripts/check_e2e_executed.py --report e2e/results.xml --min 267 --lane "invariants lane"

      - name: Clear the previous lane's JUnit report
        run: rm -f e2e/results.xml

      - name: Run axe + parity + real-integration suites (blocking)
        working-directory: e2e
        # Playwright's webServer self-starts the FastAPI app (see
        # e2e/playwright.config.ts). --retries=0 keeps the gate honest: no
        # flaky-masking retries. CI=true makes the config run serially with a
        # fresh server, forbid `.only`, and use the bundled Chromium.
        env:
          CI: "true"
        run: >-
          npx playwright test
          tests/accessibility/axe-all-views.spec.ts
          tests/ui-parity/parity-behavior.spec.ts
          tests/docs/docs-under-csp.spec.ts
          tests/invariants/real-integration-smoke.spec.ts
          tests/degraded/degraded-banner.spec.ts
          tests/ops/ops-dashboard.spec.ts
          tests/ops/ops-navigation.spec.ts
          --project=chromium
          --retries=0

      # EXECUTED-COUNT FLOOR. Playwright exits 0 when a spec path matches nothing
      # and when every test it found was skipped, so a lane that quietly stopped
      # running is indistinguishable from a clean pass — on a BLOCKING gate.
      # Floor is the EXACT count measured on 2026-07-30 (96 — WP-H added two
      # degraded-banner honesty tests and removed one over invisible markup), for
      # the reason given
      # on the invariants lane above: they are not derived from
      # the spec list above, or they could never detect that list shrinking.
      - name: "axe + parity lane: floor on tests actually executed"
        run: python3 scripts/check_e2e_executed.py --report e2e/results.xml --min 96 --lane "axe + parity lane"

      - name: Clear the previous lane's JUnit report
        run: rm -f e2e/results.xml

      # Issue #127: workspace.spec.ts (16), accessibility.spec.ts (16),
      # api-mocking.spec.ts (9) and navigation.spec.ts (10) ran in ZERO CI
      # workflows -- committed, passing locally, never executed anywhere.
      # Per the issue's own two-part order: fixed genuine test staleness
      # first (a first-visit-gate localStorage seed the page object never
      # set; dead `#cost-confirmation-message`/`#proceed-run` markup from a
      # superseded single-step cost flow; an exact-vs-wildcard route pattern
      # that missed the estimate-first Ctrl+Enter path; a copy-drifted
      # button-name regex; an impossible Shift+Tab-from-the-first-element
      # focus assertion; a permanently `display:none` legacy nav landmark)
      # -- THEN wired the now-healthy result in here, never a still-red one.
      - name: Run workspace + accessibility + api-mocking + navigation suites (blocking)
        working-directory: e2e
        env:
          CI: "true"
        run: >-
          npx playwright test
          tests/workspace/workspace.spec.ts
          tests/accessibility/accessibility.spec.ts
          tests/api-mocking/api-mocking.spec.ts
          tests/navigation/navigation.spec.ts
          --project=chromium
          --retries=0

      # EXECUTED-COUNT FLOOR, same reasoning as the two lanes above. Floor is
      # the EXACT count measured on 2026-08-03 (51 = 16 + 16 + 9 + 10).
      - name: "workspace/accessibility/api-mocking/navigation lane: floor on tests actually executed"
        run: python3 scripts/check_e2e_executed.py --report e2e/results.xml --min 51 --lane "workspace/accessibility/api-mocking/navigation lane"

      - name: Clear the previous lane's JUnit report
        # Adversarial review (#162/#166): without this, a Playwright run that
        # exits 0 having genuinely written nothing (the exact "all-skipped"
        # or "matched nothing" shape every floor in this file exists to
        # catch) would leave the new visual-snapshots floor below reading the
        # STALE 51-test report from the lane above and passing on old data
        # instead of catching the gap. Matches the same clear-before-run
        # pattern already used between the invariants and axe+parity lanes.
        #
        # It carries the SAME `if:` as the two steps below it, and must. With no
        # condition, an earlier lane failing skipped this clear while the visual
        # lane and its floor still ran — so a visual run that matched nothing
        # left the PREVIOUS lane's report in place and the floor passed on it.
        # Demonstrated by review: a Playwright run naming a spec that does not
        # exist exits "No tests found." WITHOUT rewriting results.xml, and the
        # floor then reported `51 tests executed (floor 8)`, exit 0. It could not
        # produce green-when-broken (the job was already red from the earlier
        # lane), but it is the exact misreport this step exists to prevent.
        #
        # Deliberately worded without the literal command: the retries guard in
        # tests/unit/test_e2e_flake_policy.py scrapes this file for that string
        # as raw TEXT, so naming it inside a comment reds the gate. Rule 8, from
        # the other side.
        if: ${{ !cancelled() && steps.install-chromium.outcome == 'success' }}
        run: rm -f e2e/results.xml

      - name: Run visual snapshots (BLOCKING)
        working-directory: e2e
        # toHaveScreenshot baselines for the result + transcript views against the
        # golden messy fixture — the human-reviewed guard for the #33 layout.
        # The *-linux.png baselines were seeded in THIS CI container by
        # seed-visual-baselines.yml (--update-snapshots) and committed; here they
        # are COMPARED like-for-like. Dynamic regions (timer/run-id) + toasts are
        # masked/hidden so the diff never flakes.
        #
        # `if: !cancelled()` — run REGARDLESS of a prior TEST step's outcome (but
        # not on cancellation). This is still a HARD gate (it fails the job if IT
        # fails; no continue-on-error), but it is no longer SKIPPED when an
        # earlier step reds — so a flake in the axe/parity suite can never mask a
        # real visual regression here. Independent gates, each reporting itself.
        #
        # The `install-chromium` conjunct was added after this bit us: a failure
        # in the negative-assertion guard (a SETUP step, before the browser was
        # installed) skipped every lane, and then this one ran anyway with no
        # browser on disk. It produced 8 `browserType.launch: Executable doesn't
        # exist` failures plus a "0 executed" floor red — three loud signals all
        # pointing away from the one-line real cause. Independence from a failing
        # TEST lane is the point; running without a browser is not.
        if: ${{ !cancelled() && steps.install-chromium.outcome == 'success' }}
        env:
          CI: "true"
        # trust-score-visual.spec.ts is BLOCKING alongside visual-snapshots (the
        # repo forbids continue-on-error in e2e.yml — the invariants are hard
        # gates). Its PNGs are seeded by the glob-driven seed-visual-baselines.yml
        # and HUMAN-REVIEWED before merge (§5.3): the operator runs the seed
        # workflow, reviews every new/changed PNG, then this compare goes green.
        run: >-
          npx playwright test
          tests/invariants/visual-snapshots.spec.ts
          tests/invariants/trust-score-visual.spec.ts
          --project=chromium
          --retries=0

      # EXECUTED-COUNT FLOOR. Issue #162/#166: this step was the one gap left
      # by the two floors above, because its count was never measured on the
      # authoring machine — the baselines are Linux-only, seeded in CI, so a
      # pixel-comparison run couldn't be trusted locally. Measured fresh here
      # via `--update-snapshots` (which executes every test regardless of
      # platform-specific baseline availability, without touching the
      # committed *-chromium-linux.png files this step actually compares
      # against): 8 = 6 (trust-score-visual, 2 themes x 3 viewports) + 2
      # (visual-snapshots, result + transcript). `!cancelled()` matches the
      # run step above: this must still report even if visual-snapshots
      # itself failed on a real regression, since "0 executed" and "8
      # executed, 3 failed" are different failure modes this floor exists to
      # tell apart.
      - name: "visual-snapshots lane: floor on tests actually executed"
        if: ${{ !cancelled() && steps.install-chromium.outcome == 'success' }}
        run: python3 scripts/check_e2e_executed.py --report e2e/results.xml --min 8 --lane "visual-snapshots lane"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
