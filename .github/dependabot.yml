# Monthly updates for every lock file in the repository (W118). Minor and
# patch updates are grouped; each major version arrives as its own pull request
# and is its own work item (ADR-0186). Up to 10 open version-update pull
# requests per ecosystem (the default, 5, would hold back a sixth major).
# Each waits 7 days after a release before it is proposed (zizmor's
# dependabot-cooldown audit). Alerts for known vulnerabilities are separate
# from this schedule.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      e2e:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
