# Fly.io configuration for Quorum-AI
#
# Deploy: `fly deploy`
# Secrets: `fly secrets set OPENROUTER_API_KEY=... QUORUM_TOKEN_SECRET=...`
#
# This config assumes a single-instance deployment (no scaling).
# Query runs are in-process state and are documented as MVP design.
# SESSIONS ARE NOT, since ADR-0073: they are mirrored to SQLite on the
# volume below, because the per-IP mint cap that counts them is durable
# and the two lifetimes disagreeing locked returning visitors out. When
# you need multiple instances, add Fly Postgres + Upstash Redis and
# refactor src/product_app/query_runs.py; sessions need the shared-volume
# question answered first (see ADR-0002 on single-writer SQLite).

app = "quorum-ai"
primary_region = "iad"  # US East (Virginia) - adjust to nearest region
kill_signal = "SIGINT"
kill_timeout = "5s"

[env]
  # Production environment variables baked into the image.
  # Secrets go in `fly secrets set`, not here.
  APP_NAME = "Quorum-AI"
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  RUNTIME_ENVIRONMENT = "production"
  SESSION_COOKIE_SECURE = "true"
  ACCOUNT_LEGACY_HEADER_ENABLED = "false"
  OPENROUTER_APP_URL = "https://quorum.stackclimb.com"
  # OFF. Re-open only with `make close-window`'s counterpart: a covering entry
  # in configs/live-execution-windows.json in the SAME pull request. Closing is
  # `make close-window`, which flips this AND expires the window atomically —
  # flipping this alone is REFUSED, because a window still covering `now` may
  # not be committed with the flag off (#407).
  #
  # This is the ONLY switch that lets real money be spent: providers.py:670 is
  # `openrouter_live_execution_enabled and openrouter_key`, and the key is
  # already a deployed secret. Whenever this reads "true", EVERY visitor to /ui
  # spends real money against GLOBAL_DAILY_CEILING_USD ($5.00/day) — not just
  # the operator.
  #
  # The 2026-09-01 window (19:57Z-21:07Z, #268) MEASURED: three runs on three
  # varied question shapes, $0.1649 actual spend, 12 `:online` calls, all three
  # runs live_count 4/4 with cost_source "measured" and no failed steps.
  # 11 of those 12 exceeded cost_web_search_context_tokens = 2000 (max 2890,
  # 44% over); one was -63. Combined with the prior sample that is n=32 online
  # calls, 27 over. Recorded on #268; the constant is NOT moved here (ADR-0081
  # freezes that class, W3 STOP).
  #
  # It read "true" from 15d822c (2026-08-19) to 79b5222 (2026-08-22) to collect the
  # #268/#105 sample. Measured over that window: $0.1768 total spend, THREE
  # runs, all three ours. One /ui load. ZERO 5xx events, so #105 gathered
  # nothing at all. ADR-0060 records what the sample did and did not settle.
  #
  # Nothing in the product needs this on continuously, and the failure mode is
  # silent: an unattended visitor spends money for no measurement. Turn it on
  # only against a written traffic plan, and revert in the same session.
  #
  # #357 / ADR-0070: "revert in the same session" is now executed, not merely
  # written. Setting this to "true" REQUIRES a covering entry in
  # configs/live-execution-windows.json in the SAME pull request, or
  # tests/unit/test_live_execution_posture_declaration.py refuses the merge in a
  # blocking lane. And whatever route the flag takes into production — including
  # `fly secrets set`, which no file here can see —
  # .github/workflows/live-posture-watchdog.yml reads /ready every 30 minutes
  # and opens an issue if the live posture outlives its declared window.
  #
  # ADR-0071: the declaration entry needs a `mode` ("time_boxed" or "standing")
  # and a `judge` boolean, and a window running longer than 24h needs a HUMAN
  # re-affirmation — a GitHub issue comment, because anything a workflow token
  # posts is typed "Bot" and refused. There is deliberately still no maximum
  # window length: #357 ran ~3 days and issue #105 needs ~7, so no number
  # separates them; "is anybody still watching" does.
  OPENROUTER_LIVE_EXECUTION_ENABLED = "false"
  # issue #27: keep the feedback-event SQLite trail on the persistent volume
  # (mounted at /data below), NOT the ephemeral rootfs default (.data/…) which
  # is wiped on every deploy — that erased the self-improving-loop history.
  FEEDBACK_DB_PATH = "/data/feedback_events.sqlite3"

  # ADR-0073: durable browser sessions, on the same persistent volume and for
  # the same reason. Unset, this defaults to ``.data/sessions.sqlite3`` on the
  # ephemeral rootfs, which is wiped whenever the machine stops — and with
  # ``min_machines_running = 0`` below it stops whenever the app goes idle.
  # That is precisely the lockout ADR-0073 exists to fix, so leaving this
  # unset in production would ship the fix with its effect switched off.
  SESSION_DB_PATH = "/data/sessions.sqlite3"
  # R2 S1 (FR-014): durable terminal run-history sink, same persistent volume.
  # Sibling of the feedback trail; wiped-on-deploy would defeat evaluation and
  # (later) operability trends, so it lives on /data too.
  RUN_HISTORY_DB_PATH = "/data/run_history.sqlite3"
  # Issues #105 / #268 / #203: bounded JSONL telemetry, same volume, same
  # reason. Fly's log ring holds ~100 lines (measured 2026-08-10 with
  # `fly logs --app quorum-ai --no-tail | wc -l`) and no log drain exists, so
  # stdout alone collects nothing a week-long reading could use. UNSET MEANS
  # OFF — the test suite and any other deployment write no telemetry files at
  # all. Ceiling is 25 MiB across both files. See
  # docs/adr/0031-three-blocked-issues-get-durable-telemetry-not-a-guessed-fix.md,
  # which also records the condition for deleting each stream.
  TELEMETRY_LOG_DIR = "/data"

[experimental]
  # Required for single-instance state to be stable across deploys.
  # Sessions themselves survive a restart since ADR-0073; the remaining
  # in-process state (query runs) does not.
  auto_rollback = true

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/ready"
    protocol = "http"

  min_machines_running = 0
  auto_stop_machines = "stop"
  auto_start_machines = true

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  # The two SQLite sinks create their own schema on first open, so there is
  # still no release-time migration step. ADR-0073 added a third; it does the
  # same, and a read-only volume degrades rather than blocking the boot.
  release_command = "echo 'Release deploy complete - schemas are self-creating; no migration step'"
  strategy = "rolling"

# NOTE: no `[metrics]` block. The app exposes /health, /ready, /status but no
# Prometheus /metrics endpoint (no exporter is wired), so a `[metrics]` scrape
# would 404 on every poll. Re-add this block only alongside a real /metrics
# route + exporter. See issue #36.

# issue #27: persistent volume for the feedback-event SQLite trail. Without
# this, `.data/…` lives on the ephemeral rootfs and is wiped on every deploy,
# erasing the self-improving-loop history. FEEDBACK_DB_PATH (in [env] above)
# points the store at /data on this volume.
#
# ⚠ OPERATOR PREREQUISITE — the volume MUST exist before this config deploys, or
#   the deploy fails to mount it. Create it ONCE (single-instance app, iad):
#       fly volume create quorum_data --app quorum-ai --region iad --size 1
#   Only merge this change AFTER the volume exists. (This is why the PR adding
#   it is a DRAFT — see MORNING-REPORT.)
[[mounts]]
  source = "quorum_data"
  destination = "/data"
