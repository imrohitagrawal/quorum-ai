      <p class="lede" id="sign-in-lede">
        Signing in is not limited by this. A signed-in account has its own
        limits, so sign in to keep going.
      </p>
      <p>
        <button id="sign-in-google" class="sign-in" type="button" data-csrf="__CSRF_TOKEN__">Sign in with Google</button>
      </p>
      <p class="detail" id="sign-in-status" role="status"></p>
      <script>
        // W34 (ADR-0139): the one control on this page. A button and a
        // fetch, not a form: the content-security policy has form-action
        // 'none'. The start route needs the session cookie the capped page
        // set and the CSRF token the server put on the button. Google's URL
        // is followed only when it really is Google's, checked by host.
        (function () {
          var button = document.getElementById("sign-in-google");
          var note = document.getElementById("sign-in-status");
          function isGoogle(url) {
            try { return new URL(url).host === "accounts.google.com"; } catch (e) { return false; }
          }
          function fail(text) { note.textContent = text; button.disabled = false; }
          button.addEventListener("click", function () {
            button.disabled = true;
            note.textContent = "";
            fetch("/v1/auth/google/start", {
              method: "POST",
              credentials: "same-origin",
              headers: { "X-CSRF-Token": button.getAttribute("data-csrf") || "" }
            }).then(function (response) {
              return response.json().catch(function () { return {}; }).then(function (body) {
                if (response.status === 200 && isGoogle(body.authorization_url)) {
                  window.location.assign(body.authorization_url);
                } else if (response.status === 429 && body.detail && body.detail.message) {
                  fail(body.detail.message);
                } else {
                  fail("Sign-in could not start. Reload this page and try again.");
                }
              });
            }).catch(function () {
              fail("Sign-in could not start. Check your connection and try again.");
            });
          });
        })();
      </script>
